name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17 (para sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Java 8 (para Gradle 2.14.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Crear SDK de Android aislado
        run: |
          set -euo pipefail

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          # Leer exactamente lo que piden los build.gradle del proyecto
          PLATFORMS=$(grep -rhoE 'compileSdkVersion[[:space:]]+[0-9]+' --include=build.gradle . | grep -oE '[0-9]+$' | sort -u)
          TOOLS=$(grep -rhoE 'buildToolsVersion[[:space:]]+"[0-9.]+"' --include=build.gradle . | grep -oE '[0-9.]+' | sort -u)
          echo "Plataformas requeridas: $PLATFORMS"
          echo "Build-tools requeridas: $TOOLS"
          if [ -z "$PLATFORMS" ] || [ -z "$TOOLS" ]; then
            echo "No se pudieron leer compileSdkVersion/buildToolsVersion"; exit 1
          fi

          # sdkmanager moderno (el del runner; si no existe, se descarga)
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$HOME/cmdline-tools"
            SDKMANAGER="$HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          fi

          NEW_SDK="$HOME/android-sdk"
          mkdir -p "$NEW_SDK"

          yes | "$SDKMANAGER" --sdk_root="$NEW_SDK" --licenses > /dev/null || true

          PKGS="platform-tools tools"
          for p in $PLATFORMS; do PKGS="$PKGS platforms;android-$p"; done
          for t in $TOOLS; do PKGS="$PKGS build-tools;$t"; done
          echo "Instalando: $PKGS"
          "$SDKMANAGER" --sdk_root="$NEW_SDK" $PKGS

          # AGP 2.x lee los proguard de SDK/tools/proguard; si no existen, se crean vacios
          mkdir -p "$NEW_SDK/tools/proguard"
          for f in proguard-android.txt proguard-android-optimize.txt proguard-defaults.txt; do
            [ -f "$NEW_SDK/tools/proguard/$f" ] || touch "$NEW_SDK/tools/proguard/$f"
          done

          # Que Gradle use SOLO este SDK
          echo "ANDROID_HOME=$NEW_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$NEW_SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$NEW_SDK" > local.properties

          echo "Contenido del SDK aislado:"
          ls "$NEW_SDK" "$NEW_SDK/platforms" "$NEW_SDK/build-tools"

      - name: Compilar con Java 8
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
